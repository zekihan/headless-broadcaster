version: '3.8'

services:
  headless-broadcaster:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HB__WEB_HOST: 0.0.0.0
      # Set a key before exposing the broadcaster.
      HB__WEB_API_KEY: ${HB__WEB_API_KEY:?Set HB__WEB_API_KEY before exposing the broadcaster}
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/config.yaml
    restart: unless-stopped
